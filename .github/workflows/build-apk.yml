name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create gradle wrapper if needed
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version=7.5
        fi
    
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      continue-on-error: true
    
    - name: List APK files
      run: |
        echo "=== Debug APKs ==="
        find build/outputs/apk/debug -name "*.apk" -type f
        echo ""
        echo "=== Release APKs ==="
        find build/outputs/apk/release -name "*.apk" -type f 2>/dev/null || echo "No release APKs found"
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: BMCounter-debug-apk
        path: build/outputs/apk/debug/*.apk
        retention-days: 30
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: BMCounter-release-apk
        path: build/outputs/apk/release/*.apk
        retention-days: 90
      continue-on-error: true
    
    - name: Generate APK Info
      run: |
        echo "## 📱 APK Build Information" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Debug APK" >> $GITHUB_STEP_SUMMARY
        if [ -f build/outputs/apk/debug/*.apk ]; then
          for apk in build/outputs/apk/debug/*.apk; do
            echo "- **File:** \`$(basename $apk)\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size:** $(du -h $apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- **Path:** \`build/outputs/apk/debug/$(basename $apk)\`" >> $GITHUB_STEP_SUMMARY
          done
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📥 Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
